# ---------------------------------------------------------------------------
# 宝塔面板 Nginx 反向代理片段
#
# 这是「片段」，不是完整站点配置：故意不含 listen / server_name / ssl_certificate。
# 那些由宝塔面板自己管理（站点域名、SSL 证书、HTTP 跳转 HTTPS 都在面板里点）。
# 把下面的 location 段粘到宝塔「网站 → 设置 → 配置文件」里对应 server{} 的内部即可。
#
# 更省事的做法：宝塔「网站 → 设置 → 反向代理 → 添加反向代理」，
# 目标 URL 填 http://127.0.0.1:3001（API 站）或 http://127.0.0.1:8081（Admin 站），
# 宝塔生成的 location / 与下面的内容等价，就不用手工粘贴了。
#
# 端口为什么是 127.0.0.1：compose 把 api 绑在 127.0.0.1:3001、admin 绑在 127.0.0.1:8081，
# 公网只能经宝塔 Nginx 进来。这样即使宝塔防火墙没配、云安全组漏配，应用也不会直接裸奔。
# ---------------------------------------------------------------------------


# ===========================================================================
# 站点一：API 站（例如 api.example.com）
#   小程序 request 合法域名填这个站点的 HTTPS 地址 + /api
# ===========================================================================
# client_max_body_size 要比 API 的 bodyLimit 大一点，否则 nginx 会先一步返回 413
# 而看不到 API 自己的错误信息。API 是 1MB；图片不走 API，而是拿 STS 直传 COS。
client_max_body_size 2m;

location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # API 启动时开了 trustProxy，靠这几个头还原真实来源与协议。
    # 漏掉 X-Forwarded-Proto 会让 API 以为自己在 http 上。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 万象抠图是异步的：发起裁剪后小程序会轮询详情状态，单次请求都不长。
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}


# ===========================================================================
# 站点二：运营后台（例如 admin.example.com）
#   前端是 SPA，静态资源由 admin 容器内的 nginx 提供（自带 try_files 回退）；
#   /api 必须反代到 API，因为前端写的是同源相对路径 fetch('/api/admin...')。
#
#   如果不想单独开一个域名，也可以把这段挂在 API 站点的 /admin/ 下，
#   但那样要改前端构建产物里的资源基路径，不划算 —— 建议直接开子域名。
# ===========================================================================
# client_max_body_size 2m;

location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
