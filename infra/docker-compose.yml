services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bagcollect}
      POSTGRES_USER: ${POSTGRES_USER:-bagcollect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${API_IMAGE:?set API_IMAGE}
    command: ["pnpm", "db:deploy"]
    env_file: ${BAGCOLLECT_RUNTIME_ENV_FILE:-.env.deploy}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bagcollect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bagcollect}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    env_file: ${BAGCOLLECT_RUNTIME_ENV_FILE:-.env.deploy}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bagcollect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bagcollect}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      STORAGE_DRIVER: cos
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    image: ${WORKER_IMAGE:?set WORKER_IMAGE}
    restart: unless-stopped
    env_file: ${BAGCOLLECT_RUNTIME_ENV_FILE:-.env.deploy}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bagcollect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bagcollect}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      STORAGE_DRIVER: cos
      # 抠图走腾讯云数据万象「通用抠图 AIPicMatting」，详见 docs/TENCENT_CI_MATTING.md。
      # 万象是按次计费的云端接口，不是本机进程，因此 worker 不需要依赖任何推理服务。
      CI_MATTING_PROCESS: ${CI_MATTING_PROCESS:-AIPicMatting}
      CI_MATTING_TIMEOUT_MS: ${CI_MATTING_TIMEOUT_MS:-60000}
      CI_MATTING_MAX_RESPONSE_BYTES: ${CI_MATTING_MAX_RESPONSE_BYTES:-83886080}
      CI_MATTING_MAX_CONCURRENCY: ${CI_MATTING_MAX_CONCURRENCY:-4}
      CI_MATTING_RETRY: ${CI_MATTING_RETRY:-1}
      CI_MATTING_SIZE_MODE: ${CI_MATTING_SIZE_MODE:-rescale}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 自托管 rembg + BiRefNet 抠图服务。已不在主链路上（worker 不依赖它），
  # 定义保留未删除，需要单独跑推理服务时再启用。
  # ---------------------------------------------------------------------------
  # rembg:
  #   image: ${REMBG_IMAGE:?set REMBG_IMAGE}
  #   restart: unless-stopped
  #   environment:
  #     REMBG_HOME: /models
  #     # --threads 的服务端并发上限（不是推理线程数）。保持 1。
  #     REMBG_SERVER_CONCURRENCY: ${REMBG_SERVER_CONCURRENCY:-1}
  #     # 推理线程数：留空 = 交给 onnxruntime 按可用核数自行决定，实测最快。
  #     # 只有当容器被 --cpus 限流时才需要显式设为配额内的数值。
  #     REMBG_OMP_NUM_THREADS: ${REMBG_OMP_NUM_THREADS:-}
  #   volumes:
  #     - rembg-models:/models
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/openapi.json', timeout=3)"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 20
  #     start_period: 30s

  admin:
    image: ${ADMIN_IMAGE:?set ADMIN_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8081}:80"

volumes:
  postgres-data:
  redis-data:
  # rembg 模型卷，仅在上面的 rembg 服务被启用时才需要。
  # rembg-models:
