  .header .count { font-size: 24px; font-weight: 500; color: #000; line-height: 24px; }
  .scene { position: relative; margin: 22px -15px 0; }
  .rope { position: absolute; left: 0; right: 0; top: 15px; height: 6px; border-radius: 999px;
    background:

  .art { position: relative; z-index: 2; height: 112px; margin-top: -5px; display: flex; align-items: flex-end; justify-content: center; transform-origin: 50% 0; }
  .tilt-left .art { animation: swayL 5.2s ease-in-out infinite alternate; }
  .tilt-right .art { margin-top: 3px; animation: swayR 5.8s ease-in-out infinite alternate; }
  @keyframes swayL { from { transform: rotate(-4deg); } to { transform: rotate(-1deg); } }
  @keyframes swayR { from { transform: rotate(1deg); } to { transform: rotate(4deg); } }
  .bag { width: 71px; height: 110px; filter: drop-shadow(0 5px 5px rgba(0,0,0,.22)); }
  .copy { width: 100%; margin-top: 6px; }
  .name { display: block; font-size: 12px; font-weight: 500; color: #1a1a1a; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: block; font-size: 11px; color: #7a7c80; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .featured { position: relative; width: 318px; height: 318px; margin: 16px auto 0; border: 1px solid rgba(255,255,255,.9); border-radius: 36px; overflow: hidden; background: linear-gradient(180deg, #ffffff 0%, #f7f3ec 100%); }

  .featured .fname { font-size: 18px; font-weight: 700; color: #000; }

  .scroll { overflow-x: auto; scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
