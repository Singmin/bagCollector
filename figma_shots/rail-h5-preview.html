<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小程序首页挂绳区预览（对齐 h5-prototype）</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: start center; background: #d8d4cf; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  /* 375px 视口 = 小程序 750rpx，1rpx = 0.5px */
  .phone { width: 375px; margin: 24px 0 48px; padding: 40px 15px 60px; box-sizing: border-box; background: #f2f3f7; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .home-header { display: flex; justify-content: space-between; padding-top: 8px; }
  .home-title { display: block; font-size: 24px; font-weight: 500; line-height: 24px; letter-spacing: -.5px; color: #000; }
  .home-subtitle { display: block; margin-top: 6px; color: #7a7c80; font-size: 12px; }
  .featured-card { display: block; width: 318px; height: 318px; margin: 16px auto 0; border-radius: 36px; border: 1px solid rgba(255,255,255,.9);
    background: radial-gradient(circle at 50% 34%, #fbe9c8 0%, #f6d9a6 42%, #eec287 100%); position: relative; }
  .featured-card::after { content: "展示台卡片（保持不变）"; position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; color: #7a7c80; font-size: 12px; }

  /* ── 挂袋绳区：与 showcase/index.vue 同步（px = rpx/2）── */
  .recent-section { margin-top: 18px; }
  .recent-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 0 4px 3px; }
  .recent-eyebrow { display: block; color: #77736d; font-size: 10px; font-weight: 750; letter-spacing: 1.75px; }
  .recent-title { display: block; margin-top: 5px; color: #141414; font-family: Georgia, "Songti SC", serif; font-size: 25px; line-height: 1.05; letter-spacing: -.5px; }
  .recent-all { border: 0; background: transparent; margin: 0 0 3px; padding: 0; color: #77736d; font-size: 11px; line-height: 16px; cursor: pointer; }
  .recent-all b { color: #141414; font-weight: 400; margin-left: 3px; }
  .recent-scroll { position: relative; z-index: 1; width: 375px; overflow-x: auto; scrollbar-width: none; }
  .recent-scroll::-webkit-scrollbar { display: none; }
  .recent-scene { position: relative; display: inline-flex; min-width: 100%; padding: 48px 12px 14px; }
  .rail-rope { position: absolute; z-index: 0; left: 0; top: 20px; width: 100%; height: 28px; pointer-events: none; }
  .recent-row { position: relative; z-index: 1; display: inline-flex; align-items: flex-start; }
  .recent-item { width: 110px; flex: 0 0 110px; margin: 0; padding: 0; border: 0; background: transparent; text-align: center; }
  .recent-item + .recent-item { margin-left: -20px; }
  .rail-hang { position: relative; transform-origin: 50% 0; }
  .hang-tilt-left { animation: sway-left 5.6s ease-in-out infinite alternate; }
  .hang-tilt-right { animation: sway-right 6.4s ease-in-out infinite alternate; }
  @keyframes sway-left { from { transform: rotate(-3.4deg); } to { transform: rotate(-1.6deg); } }
  @keyframes sway-right { from { transform: rotate(1.6deg); } to { transform: rotate(3.4deg); } }
  .rail-clip { position: absolute; z-index: 3; left: 50%; width: 26px; height: 26px; margin-left: -13px; filter: drop-shadow(0 1px 3px rgba(30,22,8,.3)); }
  .rail-frame { position: relative; z-index: 1; padding: 5px; border: 1.5px solid #8a6f45; border-radius: 4px; background: rgba(255,255,255,.26); backdrop-filter: blur(7px); box-shadow: 0 3px 10px rgba(60,45,20,.14), inset 0 1px 0 rgba(255,255,255,.4); }
  .rail-photo { position: relative; display: flex; align-items: center; justify-content: center; height: 142px; border-radius: 2px; overflow: hidden; }
  .rail-photo img { width: 96%; height: 90%; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(0,0,0,.28)); }
  .rail-meta { padding: 7px 3px 0; }
  .rail-name { display: block; overflow: hidden; color: #4a3a22; font-family: Georgia, "Songti SC", serif; font-size: 13px; line-height: 18px; white-space: nowrap; text-overflow: ellipsis; }
  .rail-info { display: block; overflow: hidden; margin-top: 2px; color: #a09274; font-size: 9px; line-height: 13px; white-space: nowrap; text-overflow: ellipsis; }
  .recent-hint { display: block; margin: 8px 20px 0; color: #8b867f; font-size: 10px; line-height: 15px; text-align: center; opacity: .8; }
  .tone-vermillion { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.08)), linear-gradient(160deg, rgba(255,224,196,.14) 0%, transparent 45%), repeating-linear-gradient(37deg, rgba(255,224,196,.08) 0 1px, transparent 1px 19px), repeating-linear-gradient(-52deg, rgba(255,224,196,.06) 0 1px, transparent 1px 27px), repeating-linear-gradient(84deg, rgba(255,224,196,.05) 0 1px, transparent 1px 33px), #a22d2c; }
  .tone-kraft { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.08)), repeating-linear-gradient(105deg, transparent 0 14px, rgba(255,255,255,.07) 14px 16px), #bd8958; }
  .tone-blue { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.08)), repeating-linear-gradient(60deg, rgba(255,255,255,.16) 0 1.5px, transparent 1.5px 13px), repeating-linear-gradient(-60deg, rgba(255,255,255,.1) 0 1.5px, transparent 1.5px 13px), #1e5c90; }
  .tone-black { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.08)), linear-gradient(145deg, transparent 0 54%, rgba(255,255,255,.12) 54% 56%, transparent 56%), #242323; }
  .tone-green { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.08)), repeating-radial-gradient(ellipse at 20% 20%, transparent 0 12px, rgba(242,221,150,.19) 12px 15px), #458951; }
  .tone-pink { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.08)), radial-gradient(circle at 15% 20%, rgba(255,255,255,.28) 0 2px, transparent 2.5px), radial-gradient(circle at 45% 60%, rgba(255,255,255,.22) 0 1.5px, transparent 2px), radial-gradient(circle at 75% 25%, rgba(255,255,255,.24) 0 2px, transparent 2.5px), radial-gradient(circle at 30% 85%, rgba(255,255,255,.2) 0 1.5px, transparent 2px), radial-gradient(circle at 85% 70%, rgba(255,255,255,.22) 0 2px, transparent 2.5px), radial-gradient(circle at 60% 40%, rgba(255,255,255,.18) 0 1.5px, transparent 2px), #f1718b; }
</style>
</head>
<body>
<div class="phone">
  <div class="home-header">
    <div><span class="home-title">袋袋集</span><span class="home-subtitle">收集每一个纸袋的故事</span></div>
    <div style="text-align:right"><span class="home-title">6</span><span class="home-subtitle">最近收藏(件)</span></div>
  </div>
  <div class="featured-card"></div>

  <div class="recent-section">
    <div class="recent-heading">
      <div><span class="recent-eyebrow">RECENTLY ADDED</span><span class="recent-title">最近收集</span></div>
      <button class="recent-all">查看全部 <b>→</b></button>
    </div>
      <div class="recent-scroll">
      <div class="recent-scene" id="scene">
        <img class="rail-rope" id="rope" src="../apps/miniapp/src/static/figma/rail-rope.png" alt="">
        <div class="recent-row" id="row"></div>
      </div>
    </div>
    <span class="recent-hint">← 按住卡片左右拨动 · 轻点查看详情 →</span>
  </div>
</div>
<script>
  // 与 showcase/index.vue 的 RAIL 常量一致（rpx），预览里 1rpx = 0.5px
  const RAIL = { cardW: 220, step: 180, padX: 24, padTop: 96, ropeTop: 40, ropeH: 56, clip: 52 };
  const TONES = ['vermillion', 'kraft', 'blue', 'black', 'green', 'pink'];
  const BAGS = [
    { name: '牛皮纸手提袋', info: '霸王茶姬 · 09.15', img: '../h5-prototype/chagee1.png' },
    { name: '插画手提袋', info: '霸王茶姬 · 09.12', img: '../h5-prototype/chagee2.png' },
    { name: '拼色手提袋', info: '霸王茶姬 · 09.10', img: '../h5-prototype/chagee3.png' },
    { name: '简约手提袋', info: '霸王茶姬 · 09.08', img: '../h5-prototype/chagee4.png' },
    { name: '牛皮纸手提袋', info: '瑞幸咖啡 · 09.05', img: '../h5-prototype/luckin1.png' },
    { name: '插画手提袋', info: '瑞幸咖啡 · 09.02', img: '../h5-prototype/luckin2.png' }
  ];
  const n = BAGS.length;
  const sceneWidth = RAIL.padX * 2 + RAIL.cardW + RAIL.step * (n - 1);
  const ropeWidth = Math.max(sceneWidth, 750);
  const px = (rpx) => rpx / 2;

  function ropeYAt(index) {
    const centerX = RAIL.padX + RAIL.step * index + RAIL.cardW / 2;
    const t = Math.min(1, Math.max(0, centerX / ropeWidth));
    return RAIL.ropeTop + ((6 + 92 * t * (1 - t)) / 40) * RAIL.ropeH;
  }
  const clipTop = (i) => Math.round(ropeYAt(i) - RAIL.padTop - RAIL.clip / 2);
  const hangDrop = (i) => Math.round(ropeYAt(i) - RAIL.padTop + 20);

  document.getElementById('row').innerHTML = BAGS.map((bag, i) => `
    <button class="recent-item">
      <div class="rail-hang ${i % 2 === 0 ? 'hang-tilt-right' : 'hang-tilt-left'}" style="animation-delay:${(i % 4) * -1.3}s">
        <img class="rail-clip" src="../apps/miniapp/src/static/figma/rail-clip.svg" style="top:${px(clipTop(i))}px" alt="">
        <div class="rail-frame" style="margin-top:${px(hangDrop(i))}px">
          <div class="rail-photo tone-${TONES[i % TONES.length]}"><img src="${bag.img}" alt=""></div>
        </div>
        <div class="rail-meta"><span class="rail-name">${bag.name}</span><span class="rail-info">${bag.info}</span></div>
      </div>
    </button>`).join('');
</script>
</body>
</html>
