name: Upload mini program development version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mini program version, for example 0.1.0
        required: true
      description:
        description: Upload description
        required: true
        default: Automated development upload

permissions:
  contents: read
  packages: write

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: miniapp-development
    steps:
      - uses: actions/checkout@v4
      - id: registry
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: miniapp-uploader
          push: true
          tags: ${{ steps.registry.outputs.value }}/bagcollect-miniapp-uploader:${{ github.sha }}
      - name: Upload from fixed server IP
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            docker pull "${{ steps.registry.outputs.value }}/bagcollect-miniapp-uploader:${{ github.sha }}"
            docker run --rm \
              -e WECHAT_APP_ID="${{ secrets.WECHAT_APP_ID }}" \
              -e WECHAT_PRIVATE_KEY_PATH=/run/secrets/private.key \
              -e MINIAPP_VERSION="${{ inputs.version }}" \
              -e MINIAPP_DESC="${{ inputs.description }}" \
              -e VITE_API_BASE_URL="${{ vars.MINIAPP_API_BASE_URL }}" \
              -v "${{ secrets.WECHAT_PRIVATE_KEY_PATH }}:/run/secrets/private.key:ro" \
              "${{ steps.registry.outputs.value }}/bagcollect-miniapp-uploader:${{ github.sha }}"
