name: Upload mini program development version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Mini program version, for example 0.1.0
        required: true
      description:
        description: Upload description
        required: true
        default: Automated development upload

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: miniapp-development
    steps:
      - uses: actions/checkout@v4
      - id: registry
        # 与 deploy.yml 用同一对仓库变量，保证两个流水线推/拉的是同一个仓库地址。
        # 变量是**仓库级**的：本 job 在 miniapp-development 环境里，取不到 production
        # 环境级的变量/密钥。同理 TCR_USERNAME / TCR_PASSWORD 也必须是仓库级 secret。
        env:
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        run: |
          registry="${TCR_REGISTRY:-ccr.ccs.tencentyun.com}"
          if [ -z "$TCR_NAMESPACE" ]; then
            echo "::error::仓库变量 TCR_NAMESPACE 未配置。见 docs/DEPLOY_BAOTA.md 第 4 节。"
            exit 1
          fi
          echo "value=$registry/$TCR_NAMESPACE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: miniapp-uploader
          push: true
          tags: ${{ steps.registry.outputs.value }}/bagcollect-miniapp-uploader:${{ github.sha }}
      - name: Upload from fixed server IP
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            # 私有仓库，不登录 pull 会 unauthorized。与 deploy.yml 用同一对凭据。
            if [ -n "${{ secrets.TCR_PASSWORD }}" ]; then
              echo "${{ secrets.TCR_PASSWORD }}" | docker login "${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}" -u "${{ secrets.TCR_USERNAME }}" --password-stdin
            fi
            docker pull "${{ steps.registry.outputs.value }}/bagcollect-miniapp-uploader:${{ github.sha }}"
            docker run --rm \
              -e WECHAT_APP_ID="${{ secrets.WECHAT_APP_ID }}" \
              -e WECHAT_PRIVATE_KEY_PATH=/run/secrets/private.key \
              -e MINIAPP_VERSION="${{ inputs.version }}" \
              -e MINIAPP_DESC="${{ inputs.description }}" \
              -e VITE_API_BASE_URL="${{ vars.MINIAPP_API_BASE_URL }}" \
              -v "${{ secrets.WECHAT_PRIVATE_KEY_PATH }}:/run/secrets/private.key:ro" \
              "${{ steps.registry.outputs.value }}/bagcollect-miniapp-uploader:${{ github.sha }}"
