name: CI

# PR 上直接触发；main 分支由 deploy.yml 通过 workflow_call 复用同一个 job，
# 避免「CI 通过」与「部署」并发跑、部署跑在没验过的代码上。
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bagcollect_test
          POSTGRES_USER: bagcollect
          POSTGRES_PASSWORD: bagcollect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bagcollect -d bagcollect_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://bagcollect:bagcollect@localhost:5432/bagcollect_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      WECHAT_AUTH_MOCK: "true"
      BUILD_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.3 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Set Admin build time
        run: echo "BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - run: pnpm verify
      - run: pnpm test:integration
      - run: pnpm test:scan
      - run: pnpm test:learning
      - name: Prepare verified Admin artifact
        run: |
          test -s apps/admin/dist/index.html
          mkdir -p admin-artifact/assets
          cp -R apps/admin/dist/. admin-artifact/assets/
          printf '%s\n' "$GITHUB_SHA" > admin-artifact/source-sha
      - name: Build Docker targets
        run: |
          # api 这个 target 同时承载 api 与 worker 两个容器（compose 用 command 区分），
          # 所以不单独构建 worker —— 理由见 infra/Dockerfile 顶部注释。
          docker build --target api -f infra/Dockerfile .
          docker build --target admin -f infra/Dockerfile .
          # 抠图已切换到腾讯云数据万象，rembg 不再参与生产链路。
          # 对应 target 仍保留在 infra/Dockerfile 中作为可回退的兜底实现，
          # 需要重新启用时取消下面一行注释，并同步恢复 compose 与部署脚本。详见
          # docs/TENCENT_CI_MATTING.md。
          # docker build --target rembg -f infra/Dockerfile .
      - name: Upload verified Admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-${{ github.sha }}
          path: admin-artifact/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
