name: CI

# PR 和分支校验使用与生产相同的本地 action；所有镜像留在当前 Runner 磁盘。
on:
  pull_request:
  push:
    branches: [codex/incremental-deploy, codex/deploy-delta-scheduler]
  workflow_call:
    inputs:
      force_cold_build:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bagcollect_test
          POSTGRES_USER: bagcollect
          POSTGRES_PASSWORD: bagcollect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bagcollect -d bagcollect_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://bagcollect:bagcollect@localhost:5432/bagcollect_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      WECHAT_AUTH_MOCK: "true"
      BUILD_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Test source and verify images on this runner
        uses: ./.github/actions/verify-release
        with:
          force_cold_build: ${{ inputs.force_cold_build == true }}
      - name: Write diagnostics to run summary
        if: always()
        shell: bash
        run: |
          for report in .runtime/deploy-diagnostics/*.json; do
            [ -f "$report" ] || continue
            printf '\n### %s\n```json\n' "$(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          done
