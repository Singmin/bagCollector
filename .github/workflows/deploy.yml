name: Build and deploy

# 部署链路（2026-10-02 重构）：
#   verify（复用 ci.yml）→ CI Runner 上构建 api/admin 镜像并推送 TCR
#   → SSH 到服务器：仅登录 TCR + 拉取镜像 + 切容器（不再在服务器上构建）。
#
# 为什么不在服务器上构建：生产服务器是小内存机器，api（sharp/prisma）与
# admin（React 完整构建）的现场 docker build 曾把宿主机拖到假死 —— 表现为
# ping 通但所有端口超时，整站不可达（2026-10-02 事故）。
# TCR 个人版与腾讯云服务器同厂商，大陆地域默认走内网拉取，几秒到几十秒。
#
# 一次性前置条件（缺一则 build-push 阶段明确报错指引）：
#   1. 腾讯云「容器镜像服务 TCR 个人版」开通，创建命名空间（如 newdawntech）
#   2. GitHub Secrets：TCR_USERNAME（腾讯云账号 ID）、TCR_PASSWORD（访问凭证）、
#      TCR_IMAGE_PREFIX（如 ccr.ccs.tencentyun.com/newdawntech）
#   3. 服务器 .env.deploy 设置 API_PUBLIC_URL=https://bagcollect.newdawntech.cn
#      （图片统一代理依赖它，默认值 localhost 会让代理 URL 指向错误地址）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署必须串行：两个部署同时在服务器上跑 migrate + 切容器会互相踩。
# 刻意不设 cancel-in-progress —— 中途掐掉部署会留下「镜像已切一半」的状态。
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 复用 ci.yml，保证「部署的一定是通过了 lint / typecheck / 单测 / 迁移 / 构建的那份代码」。
  verify:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      TCR_IMAGE_PREFIX: ${{ secrets.TCR_IMAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v4

      - name: Check TCR configuration
        run: |
          if [ -z "$TCR_USERNAME" ] || [ -z "$TCR_PASSWORD" ] || [ -z "$TCR_IMAGE_PREFIX" ]; then
            echo "::error::缺少 TCR 配置。请在 GitHub Secrets 配置三项：" >&2
            echo "  TCR_USERNAME      —— 腾讯云账号 ID（TCR 个人版登录用户名）" >&2
            echo "  TCR_PASSWORD      —— TCR 访问凭证密码（控制台「访问凭证」页生成）" >&2
            echo "  TCR_IMAGE_PREFIX  —— 镜像地址前缀，如 ccr.ccs.tencentyun.com/<命名空间>" >&2
            echo "开通指引：腾讯云控制台 → 容器镜像服务（个人版，免费）→ 创建命名空间。" >&2
            exit 1
          fi

      - name: Login to TCR
        run: echo "$TCR_PASSWORD" | docker login "${TCR_IMAGE_PREFIX%%/*}" -u "$TCR_USERNAME" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 用 buildx（docker-container 驱动）构建：只有它支持 type=gha 缓存。
      # 原生 docker build 会静默忽略 gha 缓存参数，导致每轮全量重建+全量跨境重传。
      - name: Build & push API/Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: api
          push: true
          provenance: false
          tags: ${{ secrets.TCR_IMAGE_PREFIX }}/bagcollect-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: admin
          push: true
          provenance: false
          tags: ${{ secrets.TCR_IMAGE_PREFIX }}/bagcollect-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

  deploy:
    needs: [verify, build-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Package verified source
        run: git archive --format=tar.gz --output="bagcollect-source-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"

      - name: Preflight SSH connectivity check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          echo "目标：$DEPLOY_HOST:$DEPLOY_PORT"
          ok=0
          for attempt in 1 2 3; do
            echo "--- TCP 预检第 $attempt/3 次尝试 ---"
            if nc -zv -w 10 "$DEPLOY_HOST" "$DEPLOY_PORT"; then
              ok=1
              break
            fi
            echo "TCP 第 $attempt 次不通，5 秒后重试"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::无法建立 TCP 连接 $DEPLOY_HOST:$DEPLOY_PORT —— 请检查：" >&2
            echo "  1. 服务器安全组/防火墙（宝塔）是否对公网放行该端口入站" >&2
            echo "  2. SSH 是否运行在非 22 端口，若是请配置 secret DEPLOY_PORT" >&2
            echo "  3. DEPLOY_HOST 是否只填了 IP/域名，没有混入端口或空格" >&2
            exit 1
          fi
          echo "TCP 连通，继续部署"

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 预先采集主机指纹，之后 StrictHostKeyChecking=yes 也不会交互卡住
          # -T 30：默认 5s 超时对海外->国内链路太短，放宽到 30s
          scanned=0
          for attempt in 1 2 3; do
            echo "--- ssh-keyscan 第 $attempt/3 次尝试 ---"
            if ssh-keyscan -T 60 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              scanned=1
              break
            fi
            echo "ssh-keyscan 第 $attempt 次失败（TCP 通但 banner 交换超时等），10 秒后重试"
            sleep 10
          done
          if [ "$scanned" -ne 1 ]; then
            echo "::error::ssh-keyscan 连续 3 次失败：TCP 能连通但 SSH 握手无响应（$DEPLOY_HOST:$DEPLOY_PORT）" >&2
            exit 1
          fi
          echo "主机指纹采集成功"

      - name: Copy verified source to the server
        # 源码包仅用于把最新的 infra/deploy.sh、docker-compose.yml、Dockerfile 同步到
        # 服务器（应用本身不再在服务器构建）。git archive 只包含已跟踪文件。
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_DIR: ${{ secrets.DEPLOY_PATH }}/incoming/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEY="$HOME/.ssh/deploy_key"
          COMMON="-i $KEY -o ConnectTimeout=45 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          ARCHIVE="bagcollect-source-${GITHUB_SHA}.tar.gz"
          timeout 60 ssh $COMMON -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TARGET_DIR'"
          uploaded=0
          for attempt in 1 2 3; do
            echo "--- scp 第 $attempt 次尝试 ---"
            if timeout 600 scp $COMMON -P "$DEPLOY_PORT" "$ARCHIVE" "$DEPLOY_USER@$DEPLOY_HOST:$TARGET_DIR/"; then
              uploaded=1
              break
            fi
            echo "scp 第 $attempt 次失败，5 秒后重试"
            sleep 5
          done
          [ "$uploaded" -eq 1 ] || { echo "::error::scp 连续 3 次上传失败" >&2; exit 1; }
          echo "源码包已上传：$TARGET_DIR/$ARCHIVE"

      - name: Pull images & switch containers on the server
        # 服务器只做：同步 infra 脚本 → 登录 TCR → 指向本次镜像 → deploy.sh
        # （备份 → 拉取 → 迁移 → 切容器 → 健康检查 → 失败自动恢复上一组镜像）。
        # 全程 nohup 脱离会话 + 轮询状态文件，SSH 断线不中断部署。
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          TCR_IMAGE_PREFIX: ${{ secrets.TCR_IMAGE_PREFIX }}
        run: |
          attempt=0
          max_attempts=6
          while :; do
            attempt=$((attempt+1))
            echo "===== SSH 连接（第 $attempt/$max_attempts 次）====="
            set +e
            ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
              -o ConnectTimeout=45 -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$DEPLOY_USER@$DEPLOY_HOST" /bin/bash -s <<'REMOTE_SCRIPT'
            set -eu
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            TRANSFER_DIR="$DEPLOY_DIR/incoming/${{ github.run_id }}-${{ github.run_attempt }}"
            ARCHIVE="$TRANSFER_DIR/bagcollect-source-${{ github.sha }}.tar.gz"
            RELEASE_DIR="$DEPLOY_DIR/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"

            LOG=/tmp/bagcollect-deploy.log
            STATUS_FILE="/tmp/bagcollect-deploy-${{ github.run_id }}-${{ github.run_attempt }}.status"
            LAUNCHED_FILE="$STATUS_FILE.launched"

            if [ ! -f "$STATUS_FILE" ] && [ ! -f "$LAUNCHED_FILE" ]; then
              [ -f "$ARCHIVE" ] || { echo "找不到源码包：$ARCHIVE" >&2; exit 1; }
              mkdir -p "$RELEASE_DIR"
              tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
              # 同步最新的 infra 脚本/编排到部署目录（应用镜像不在服务器构建，无需源码全部）
              cp "$RELEASE_DIR/infra/deploy.sh" "$DEPLOY_DIR/infra/deploy.sh"
              cp "$RELEASE_DIR/infra/docker-compose.yml" "$DEPLOY_DIR/infra/docker-compose.yml"
              rm -f "$LOG" "$STATUS_FILE" "$LAUNCHED_FILE"
              nohup sh -c '
                status=0
                env \
                  BAGCOLLECT_DEPLOY_DIR="$2" \
                  API_IMAGE="${{ secrets.TCR_IMAGE_PREFIX }}/bagcollect-api:${{ github.sha }}" \
                  ADMIN_IMAGE="${{ secrets.TCR_IMAGE_PREFIX }}/bagcollect-admin:${{ github.sha }}" \
                  TCR_USERNAME="${{ secrets.TCR_USERNAME }}" \
                  TCR_PASSWORD="${{ secrets.TCR_PASSWORD }}" \
                  sh "$3/infra/deploy.sh" || status=$?
                printf "%s\n" "$status" > "$1.tmp"
                mv "$1.tmp" "$1"
              ' sh "$STATUS_FILE" "$DEPLOY_DIR" "$RELEASE_DIR" \
                </dev/null >"$LOG" 2>&1 &
              touch "$LAUNCHED_FILE"
              echo "已在服务器后台启动部署（TCR 拉取模式），日志：$LOG"
            else
              echo "检测到之前的后台部署，继续跟进（不重复启动）"
            fi

            for i in $(seq 1 180); do
              [ ! -f "$STATUS_FILE" ] || break
              if [ $((i % 3)) -eq 0 ]; then
                echo "--- 服务器部署仍在进行（最近日志）---"
                tail -n 12 "$LOG" || true
              fi
              sleep 20
            done

            if [ ! -f "$STATUS_FILE" ]; then
              echo "本次连接等待超时；服务器后台任务仍会继续，重连后继续跟进，日志见 $LOG" >&2
              exit 124
            fi
            status=$(cat "$STATUS_FILE")
            tail -n 80 "$LOG"
            if [ "$status" -ne 0 ]; then
              echo "服务器部署失败（exit $status），完整日志见 $LOG" >&2
              exit 1
            fi
            grep -q "部署完成" "$LOG" || { echo "未在日志中找到『部署完成』标记" >&2; exit 1; }
            echo "本次部署的镜像版本（commit）：${{ github.sha }}"
          REMOTE_SCRIPT
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ] && { [ "$rc" -eq 255 ] || [ "$rc" -eq 124 ]; }; then
              echo "SSH 连接中断（exit $rc），服务器后台部署未受影响；30 秒后重连跟进" >&2
              sleep 30
              continue
            fi
            exit "$rc"
          done
