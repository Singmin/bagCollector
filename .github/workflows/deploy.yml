name: Build and deploy

# main 分支每次合并：先跑完整验证（复用 ci.yml），再构建镜像推 GHCR，最后 SSH 部署。
# 手动触发（workflow_dispatch）走同一条链路，只是不需要新的 commit。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署必须串行：两个部署同时在服务器上跑 migrate + 切容器会互相踩。
# 刻意不设 cancel-in-progress —— 中途掐掉部署会留下「镜像已切一半」的状态。
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # 复用 ci.yml，保证「部署的一定是通过了 lint / typecheck / 单测 / 迁移 / 构建的那份代码」。
  verify:
    uses: ./.github/workflows/ci.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.registry.outputs.value }}
    steps:
      - id: registry
        # GHCR 要求全部小写，GitHub 用户名可能有大写，这里统一转小写。
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  images:
    needs: [verify, prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 抠图已切换到腾讯云数据万象，不再构建 rembg 镜像。详见 docs/TENCENT_CI_MATTING.md。
        # api 这个镜像同时承载 api 与 worker 两个容器（compose 用 command 区分），
        # 所以没有 worker 条目 —— 合并理由见 infra/Dockerfile 顶部注释。
        target: [api, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/bagcollect-${{ matrix.target }}:${{ github.sha }}
            ${{ needs.prepare.outputs.registry }}/bagcollect-${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR on the server
        # GHCR 的 package 默认是私有的，服务器不登录就 pull 会 403。
        # 两种做法都支持：
        #   1) 配了 GHCR_USER / GHCR_TOKEN → 每次部署自动登录（推荐，换 token 无需上服务器）；
        #   2) 没配 → 沿用服务器上 `docker login ghcr.io` 留下的持久凭据。
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            else
              echo "未配置 GHCR_TOKEN，沿用服务器上已保存的 docker 凭据"
            fi

      - name: Copy deployment definition
        # 只同步部署定义，不动服务器上的 .env.deploy 与备份目录。
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "infra/docker-compose.yml,infra/deploy.sh,infra/.env.deploy.example"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy fixed image SHA
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 首次部署时冷拉一个 106MB 的层要 ~45 分钟（大陆→GHCR 实测 35KB/s），
          # 20m 的超时会在拉取中途把 SSH 会话掐断 —— 部署脚本因 stdout 管道断裂
          # 死在收尾回显那一步，GitHub 显示红叉但服务器上处于半完成状态。
          # 60m 覆盖最坏的冷拉取；平时层有缓存，整步只要 1~2 分钟。
          command_timeout: 60m
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            # 用 commit SHA 而不是 latest：回滚和排障时能确切知道服务器上跑的是哪次提交。
            # WORKER_IMAGE 已取消 —— worker 容器用同一个 bagcollect-api 镜像 + 别的 command。
            export API_IMAGE="${{ needs.prepare.outputs.registry }}/bagcollect-api:${{ github.sha }}"
            export ADMIN_IMAGE="${{ needs.prepare.outputs.registry }}/bagcollect-admin:${{ github.sha }}"

            # 关键：让部署脚本脱离 SSH 会话运行。直接跑的话，脚本的一切输出都写进
            # SSH 管道 —— 会话一旦断掉（超时/网络抖动），下一次 stdout 写入就会收到
            # SIGPIPE 被杀，部署停在半路。重定向到文件之后，即使本步骤超时变红，
            # 服务器上的部署也会继续跑完；日志留在 /tmp/bagcollect-deploy.log 可查。
            LOG=/tmp/bagcollect-deploy.log
            rm -f "$LOG"
            nohup sh infra/deploy.sh </dev/null >"$LOG" 2>&1 &

            # 轮询等它结束（160 次 × 20s ≈ 53 分钟，在 command_timeout 之内）。
            # pgrep 模式必须锚定行首：本脚本自身的命令行里也含这个字符串。
            for i in $(seq 1 160); do
              pgrep -f "^sh infra/deploy.sh" >/dev/null 2>&1 || break
              sleep 20
            done

            tail -n 40 "$LOG"
            # 脚本成功结束时固定打印「部署完成」；没等到 = 失败，set -e 让本步骤变红。
            grep -q "部署完成" "$LOG"
            echo "本次部署的镜像版本（commit）：${{ github.sha }}"
