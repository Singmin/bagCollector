name: Build and deploy

# main 分支每次合并：先跑完整验证（复用 ci.yml），再把已验证 commit 的源码传到
# 生产服务器，在服务器本地构建镜像并部署。源码只有几 MB，避免 GitHub 海外 Runner
# 向国内镜像仓库推送百 MB 镜像时长期卡在 exporting to image。
# 手动触发（workflow_dispatch）走同一条链路，只是不需要新的 commit。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署必须串行：两个部署同时在服务器上跑 migrate + 切容器会互相踩。
# 刻意不设 cancel-in-progress —— 中途掐掉部署会留下「镜像已切一半」的状态。
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 复用 ci.yml，保证「部署的一定是通过了 lint / typecheck / 单测 / 迁移 / 构建的那份代码」。
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [verify]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Package verified source
        run: git archive --format=tar.gz --output="bagcollect-source-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"

      - name: Preflight SSH connectivity check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          echo "目标：$DEPLOY_HOST:$DEPLOY_PORT"
          if nc -zv -w 10 "$DEPLOY_HOST" "$DEPLOY_PORT"; then
            echo "TCP 连通，继续部署"
          else
            echo "::error::无法建立 TCP 连接 $DEPLOY_HOST:$DEPLOY_PORT —— 请检查：" >&2
            echo "  1. 服务器安全组/防火墙（宝塔）是否对公网放行该端口入站" >&2
            echo "  2. SSH 是否运行在非 22 端口，若是请配置 secret DEPLOY_PORT" >&2
            echo "  3. DEPLOY_HOST 是否只填了 IP/域名，没有混入端口或空格" >&2
            exit 1
          fi

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 预先采集主机指纹，之后 StrictHostKeyChecking=yes 也不会交互卡住
          # -T 30：默认 5s 超时对海外->国内链路太短，放宽到 30s
          if ssh-keyscan -T 30 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "主机指纹采集成功"
          else
            echo "::error::ssh-keyscan 失败：TCP 能连通但 SSH 握手无响应（$DEPLOY_HOST:$DEPLOY_PORT）" >&2
            echo "===== SSH 详细握手诊断（看卡在哪一步）=====" >&2
            timeout 45 ssh -vv -o ConnectTimeout=20 -o BatchMode=yes \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" exit 2>&1 | tail -n 60 >&2 || true
            echo "===== 诊断结束。常见原因 =====" >&2
            echo "  1. 服务器上 sshd 未监听该端口：ss -tlnp | grep -E 'sshd|:22|:$DEPLOY_PORT'" >&2
            echo "  2. fail2ban / 宝塔 SSH 防护 / 云安全组件拦截了海外 IP" >&2
            echo "  3. 该端口实际是端口映射/转发到了其他机器" >&2
            exit 1
          fi

      - name: Copy verified source to the server
        # git archive 只包含当前 commit 的已跟踪文件，不会把本机 .env、密钥、node_modules
        # 或工作区未提交文件带到服务器。每次 run 使用独立目录，重跑不会混入旧源码。
        # 用 Runner 自带的 OpenSSH 而非 scp-action：报错信息完整，失败快速可见。
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_DIR: ${{ secrets.DEPLOY_PATH }}/incoming/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEY="$HOME/.ssh/deploy_key"
          COMMON="-i $KEY -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          ARCHIVE="bagcollect-source-${GITHUB_SHA}.tar.gz"
          echo "===== 1/3 远程建目录 ====="
          timeout 60 ssh $COMMON -v -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TARGET_DIR'"
          echo "===== 2/3 上传源码包（-v 详细握手日志见 stderr；海外→国内链路偶发卡死，最多重试 3 次每次 10 分钟）====="
          uploaded=0
          for attempt in 1 2 3; do
            echo "--- scp 第 $attempt 次尝试 ---"
            if timeout 600 scp $COMMON -P "$DEPLOY_PORT" "$ARCHIVE" "$DEPLOY_USER@$DEPLOY_HOST:$TARGET_DIR/"; then
              uploaded=1
              break
            fi
            echo "scp 第 $attempt 次失败（10 分钟超时或中断），5 秒后重试"
            sleep 5
          done
          [ "$uploaded" -eq 1 ] || { echo "::error::scp 连续 3 次上传失败" >&2; exit 1; }
          echo "===== 3/3 校验文件完整性 ====="
          timeout 60 ssh $COMMON -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s '$TARGET_DIR/$ARCHIVE' && echo '源码包已上传并通过完整性检查：$TARGET_DIR/$ARCHIVE'"

      - name: Build and deploy fixed source SHA on the server
        # 首次服务器构建需要拉基础镜像并安装依赖；后续命中 Docker BuildKit 缓存会快很多。
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" /bin/bash -s <<'REMOTE_SCRIPT'
            set -eu
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            TRANSFER_DIR="$DEPLOY_DIR/incoming/${{ github.run_id }}-${{ github.run_attempt }}"
            ARCHIVE="$TRANSFER_DIR/bagcollect-source-${{ github.sha }}.tar.gz"
            RELEASE_DIR="$DEPLOY_DIR/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"

            [ -f "$ARCHIVE" ] || { echo "找不到源码包：$ARCHIVE" >&2; exit 1; }
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

            # 构建和部署都脱离 SSH 会话。即使网页/SSH 中断，服务器仍会继续完成；
            # 每分钟回显一次末尾日志，GitHub 页面不会再长时间看起来像卡死。
            LOG=/tmp/bagcollect-deploy.log
            STATUS_FILE="/tmp/bagcollect-deploy-${{ github.run_id }}-${{ github.run_attempt }}.status"
            rm -f "$LOG"
            rm -f "$STATUS_FILE"
            nohup sh -c '
              status=0
              env \
                BAGCOLLECT_DEPLOY_DIR="$2" \
                BAGCOLLECT_RELEASE_DIR="$3" \
                BAGCOLLECT_IMAGE_TAG="$4" \
                sh "$3/infra/build-and-deploy.sh" || status=$?
              printf "%s\n" "$status" > "$1.tmp"
              mv "$1.tmp" "$1"
            ' sh "$STATUS_FILE" "$DEPLOY_DIR" "$RELEASE_DIR" "${{ github.sha }}" \
              </dev/null >"$LOG" 2>&1 &

            for i in $(seq 1 260); do
              [ ! -f "$STATUS_FILE" ] || break
              if [ $((i % 3)) -eq 0 ]; then
                echo "--- 服务器构建/部署仍在进行（最近日志）---"
                tail -n 12 "$LOG" || true
              fi
              sleep 20
            done

            status=0
            if [ ! -f "$STATUS_FILE" ]; then
              echo "服务器构建/部署超过等待上限；后台任务仍会继续，查看 $LOG" >&2
              status=124
            else
              status=$(cat "$STATUS_FILE")
            fi
            tail -n 80 "$LOG"
            [ "$status" -eq 0 ] || exit "$status"
            grep -q "部署完成" "$LOG"
            echo "本次部署的镜像版本（commit）：${{ github.sha }}"
          REMOTE_SCRIPT
