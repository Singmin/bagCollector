name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.registry.outputs.value }}
    steps:
      - id: registry
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  images:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, admin, rembg]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/bagcollect-${{ matrix.target }}:${{ github.sha }}
            ${{ needs.prepare.outputs.registry }}/bagcollect-${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy deployment definition
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "infra/docker-compose.yml,infra/deploy.sh"
          target: ${{ secrets.DEPLOY_PATH }}
      - name: Deploy fixed image SHA
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            export API_IMAGE="${{ needs.prepare.outputs.registry }}/bagcollect-api:${{ github.sha }}"
            export WORKER_IMAGE="${{ needs.prepare.outputs.registry }}/bagcollect-worker:${{ github.sha }}"
            export ADMIN_IMAGE="${{ needs.prepare.outputs.registry }}/bagcollect-admin:${{ github.sha }}"
            export REMBG_IMAGE="${{ needs.prepare.outputs.registry }}/bagcollect-rembg:${{ github.sha }}"
            sh infra/deploy.sh
