name: Build and deploy

# All image builds run in CI. Production validates and imports the verified images.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Only prepare and verify images; leave running services unchanged
        type: boolean
        default: true
      force_cold_build:
        description: Validate reproducible output without build-cache reuse
        type: boolean
        default: false
      verified_run_id:
        description: Optional successful same-SHA run to reuse; otherwise find one automatically
        type: string
        default: ''

# 部署必须串行：两个部署同时在服务器上跑 migrate + 切容器会互相踩。
# 刻意不设 cancel-in-progress —— 中途掐掉部署会留下「镜像已切一半」的状态。
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.source.outputs.reuse }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve already verified images for this exact commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERIFIED_RUN: ${{ inputs.verified_run_id }}
          COLD: ${{ inputs.force_cold_build }}
        run: |
          args=(--repo "$REPOSITORY" --sha "$SOURCE_SHA")
          [ -z "$VERIFIED_RUN" ] || args+=(--run-id "$VERIFIED_RUN")
          [ "$COLD" != true ] || args+=(--force-cold)
          python3 scripts/resolve-verified-run.py "${args[@]}"
  # 复用 ci.yml，保证「部署的一定是通过了 lint / typecheck / 单测 / 迁移 / 构建的那份代码」。
  verify:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      force_cold_build: ${{ inputs.force_cold_build == true }}

  deploy:
    needs: [resolve, verify]
    if: always() && needs.resolve.result == 'success' && (needs.resolve.outputs.reuse == 'true' || needs.verify.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download verified incremental image objects
        uses: actions/download-artifact@v4
        with:
          name: verified-images-${{ github.sha }}
          path: .
          run-id: ${{ needs.resolve.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Preflight SSH connectivity check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          echo "目标：$DEPLOY_HOST:$DEPLOY_PORT"
          ok=0
          for attempt in 1 2 3; do
            echo "--- TCP 预检第 $attempt/3 次尝试 ---"
            if nc -zv -w 10 "$DEPLOY_HOST" "$DEPLOY_PORT"; then
              ok=1
              break
            fi
            echo "TCP 第 $attempt 次不通，5 秒后重试"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::无法建立 TCP 连接 $DEPLOY_HOST:$DEPLOY_PORT —— 请检查：" >&2
            echo "  1. 服务器安全组/防火墙（宝塔）是否对公网放行该端口入站" >&2
            echo "  2. SSH 是否运行在非 22 端口，若是请配置 secret DEPLOY_PORT" >&2
            echo "  3. DEPLOY_HOST 是否只填了 IP/域名，没有混入端口或空格" >&2
            exit 1
          fi
          echo "TCP 连通，继续部署"

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 预先采集主机指纹，之后 StrictHostKeyChecking=yes 也不会交互卡住
          # -T 30：默认 5s 超时对海外->国内链路太短，放宽到 30s
          scanned=0
          for attempt in 1 2 3; do
            echo "--- ssh-keyscan 第 $attempt/3 次尝试 ---"
            if ssh-keyscan -T 60 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              scanned=1
              break
            fi
            echo "ssh-keyscan 第 $attempt 次失败（TCP 通但 banner 交换超时等），10 秒后重试"
            sleep 10
          done
          if [ "$scanned" -ne 1 ]; then
            echo "::error::ssh-keyscan 连续 3 次失败：TCP 能连通但 SSH 握手无响应（$DEPLOY_HOST:$DEPLOY_PORT）" >&2
            echo "===== SSH 详细握手诊断（看卡在哪一步）=====" >&2
            timeout 90 ssh -vv -o ConnectTimeout=45 -o BatchMode=yes \
              -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" exit 2>&1 | tail -n 60 >&2 || true
            echo "===== 诊断结束。常见原因 =====" >&2
            echo "  1. 服务器上 sshd 未监听该端口：ss -tlnp | grep -E 'sshd|:22|:$DEPLOY_PORT'" >&2
            echo "  2. fail2ban / 宝塔 SSH 防护 / 云安全组件拦截了海外 IP（GitHub Runner 每次都是不同海外共享 IP，'刚才能连现在不能'多为这类拦截）" >&2
            echo "  3. 该端口实际是端口映射/转发到了其他机器" >&2
            exit 1
          fi
          echo "主机指纹采集成功"

      - name: Check optional vision service
        id: server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          enabled=$(ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o ConnectTimeout=45 -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/infra/.env.deploy' || exit 1; if grep -Eq '^VISION_ENABLED=1$' '$DEPLOY_PATH/infra/.env.deploy'; then echo 1; else echo 0; fi")
          test "$enabled" = 0 || test "$enabled" = 1
          echo "vision=$enabled" >> "$GITHUB_OUTPUT"

      - name: Package verified source and images
        run: |
          test "$(cat production-images/source-sha)" = "$GITHUB_SHA"
          (cd production-images && sha256sum -c SHA256SUMS)
          ARCHIVE="bagcollect-control-${GITHUB_SHA}.tar"
          git archive --format=tar --output="$ARCHIVE" "$GITHUB_SHA" infra
          tar --exclude=images.tar.gz -rf "$ARCHIVE" production-images
          if [ "${{ steps.server.outputs.vision }}" = 1 ]; then
            test "$(cat vision-images/source-sha)" = "$GITHUB_SHA"
            (cd vision-images && sha256sum -c SHA256SUMS)
            tar --exclude=images.tar.gz -rf "$ARCHIVE" vision-images
          fi
          du -h "$ARCHIVE"

      - name: Transfer verified release with resume
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash infra/transfer-release.sh "bagcollect-control-${GITHUB_SHA}.tar"

      - name: Prepare and verify images without changing running services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash infra/run-release.sh prepare

      - name: Apply prepared release and confirm service health
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.prepare_only == false)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash infra/run-release.sh apply

      - name: Save deployment timing and transfer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/deploy-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
